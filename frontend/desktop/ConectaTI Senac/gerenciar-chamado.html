<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6C63FF">
    <title>Gerenciar Chamados - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .menu-icon { width:20px; height:20px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
        .menu-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .sidebar-nav a.active .menu-icon svg { stroke:white; }
        .sidebar-nav a:hover .menu-icon svg { stroke:var(--text-primary); }
        .menu-badge { background:var(--danger); color:white; font-size:0.55rem; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:auto; min-width:18px; text-align:center; }
        .menu-divider { height:1px; background:var(--border-color); margin:8px 12px; }
        
        .btn-gerenciar {
            padding: 4px 12px;
            border: none;
            border-radius: var(--border-radius-sm);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-gerenciar:hover { transform: translateY(-2px); }
        .btn-gerenciar.editar { background: var(--info); color: white; }
        .btn-gerenciar.resolver { background: var(--success); color: white; }
        .btn-gerenciar.cancelar { background: var(--danger); color: white; }
        .btn-gerenciar.atender { background: var(--primary); color: white; }
        .btn-gerenciar.visualizar { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color); }
        
        .chamado-row-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="url(#grad)"/><text x="20" y="27" font-family="Arial" font-size="16" font-weight="800" fill="white" text-anchor="middle">CT</text><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6C63FF"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient></defs></svg></div>
            <h1>ConectaTI</h1>
        </div>
        <nav class="sidebar-nav">
            <p class="nav-label">Menu Principal</p>
            <a href="dashboard.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Dashboard</a>
            <a href="acompanhar-chamado.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> Acompanhar Chamado</a>
            <a href="gerenciar-chamado.html" class="active"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span> Gerenciar Chamado <span class="menu-badge">5</span></a>
            <a href="relatorios.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg></span> Relatórios</a>
            <a href="duvidas-frequentes.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> Dúvidas Frequentes</a>
            <a href="chat.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> Chat <span class="menu-badge">3</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="userName">Usuário</div>
                    <div class="user-perfil" id="userPerfil">Perfil</div>
                    <div class="user-perfil" id="userUnidade">Unidade</div>
                </div>
            </div>
            <div class="sidebar-actions">
                <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" style="width:100%; margin-bottom:8px;">Tema</button>
                <a href="index.html" onclick="localStorage.clear();" class="btn btn-danger btn-sm" style="width:100%;">Sair</a>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">
        <header class="content-header">
            <div class="page-title">
                <h1>⚙️ Gerenciar Chamados</h1>
                <p>Gerencie todos os chamados do sistema</p>
            </div>
            <div class="header-actions">
                <span class="date-display" id="dataAtual"></span>
                <a href="novo-chamado.html" class="btn btn-primary btn-sm">+ Novo</a>
                <a href="index.html" onclick="localStorage.clear();" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </header>

        <div class="filtros-container">
            <div class="busca">
                <span class="icone">🔍</span>
                <input type="text" id="buscaGerenciar" placeholder="Buscar chamados..." oninput="filtrarGerenciar()">
            </div>
            <select id="filtroStatusGerenciar" onchange="filtrarGerenciar()">
                <option value="todos">Todos Status</option>
                <option value="Aberto">Aberto</option>
                <option value="Em atendimento">Em Atendimento</option>
                <option value="Resolvido">Resolvido</option>
                <option value="Atrasado">Atrasado</option>
            </select>
            <select id="filtroPrioridadeGerenciar" onchange="filtrarGerenciar()">
                <option value="todos">Todas Prior.</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
                <option value="Urgente">Urgente</option>
            </select>
            <button class="btn btn-outline btn-sm" onclick="filtrarGerenciar()">Aplicar</button>
        </div>

        <div class="tabela-wrapper">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Solicitante</th>
                        <th>Categoria</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaGerenciar"></tbody>
            </table>
        </div>
        <p style="padding: 0 24px 16px; font-size:0.75rem; color:var(--text-muted);" id="resultadoContadorGerenciar">Mostrando 5 chamados</p>
    </main>

    <script src="js/script.js"></script>
    <script>
        const chamadosGerenciar = [
            { id: 1, solicitante: 'Rayssa Paiva', categoria: 'Reserva de notebooks', prioridade: 'Alta', status: 'Em atendimento', data: '03/07/2026' },
            { id: 2, solicitante: 'Carla Mendes', categoria: 'Projetor', prioridade: 'Média', status: 'Aberto', data: '03/07/2026' },
            { id: 3, solicitante: 'Joao Suporte', categoria: 'Internet/Rede', prioridade: 'Urgente', status: 'Resolvido', data: '02/07/2026' },
            { id: 4, solicitante: 'Ana Souza', categoria: 'Computador com defeito', prioridade: 'Alta', status: 'Aberto', data: '03/07/2026' },
            { id: 5, solicitante: 'Pedro Santos', categoria: 'Impressora', prioridade: 'Média', status: 'Atrasado', data: '01/07/2026' }
        ];

        function getBadgeGerenciar(status) {
            const classes = {
                'Aberto': 'badge-aberto',
                'Em atendimento': 'badge-atendimento',
                'Resolvido': 'badge-resolvido',
                'Atrasado': 'badge-atrasado'
            };
            return `<span class="badge ${classes[status] || 'badge-aberto'}">${status}</span>`;
        }

        function acaoChamado(id, acao) {
            const chamado = chamadosGerenciar.find(c => c.id === id);
            if (!chamado) return;

            const acoes = {
                'atender': { status: 'Em atendimento', msg: 'Chamado em atendimento!' },
                'resolver': { status: 'Resolvido', msg: 'Chamado resolvido!' },
                'cancelar': { status: 'Cancelado', msg: 'Chamado cancelado!' },
                'editar': { status: null, msg: 'Abrindo editor...' }
            };

            const acaoObj = acoes[acao];
            if (!acaoObj) return;

            if (acao === 'editar') {
                mostrarNotificacao('📝 Editando chamado #' + id.toString().padStart(3, '0'), 'info');
                return;
            }

            chamado.status = acaoObj.status;
            mostrarNotificacao(`✅ ${acaoObj.msg}`, 'success');
            exibirGerenciar();
            atualizarBadgeGerenciar();
        }

        function atualizarBadgeGerenciar() {
            const total = chamadosGerenciar.length;
            const badge = document.querySelector('.menu-badge');
            if (badge) badge.textContent = total;
        }

        function exibirGerenciar() {
            const tbody = document.getElementById('listaGerenciar');
            const busca = document.getElementById('buscaGerenciar')?.value.toLowerCase() || '';
            const status = document.getElementById('filtroStatusGerenciar')?.value || 'todos';
            const prioridade = document.getElementById('filtroPrioridadeGerenciar')?.value || 'todos';

            let filtrados = chamadosGerenciar.filter(c => {
                const matchBusca = c.solicitante.toLowerCase().includes(busca) || c.categoria.toLowerCase().includes(busca);
                const matchStatus = status === 'todos' || c.status === status;
                const matchPrioridade = prioridade === 'todos' || c.prioridade === prioridade;
                return matchBusca && matchStatus && matchPrioridade;
            });

            tbody.innerHTML = filtrados.map(c => `
                <tr>
                    <td><strong>#${c.id.toString().padStart(3, '0')}</strong></td>
                    <td><strong>${c.solicitante}</strong></td>
                    <td>${c.categoria}</td>
                    <td>${c.prioridade}</td>
                    <td>${getBadgeGerenciar(c.status)}</td>
                    <td>${c.data}</td>
                    <td>
                        <div class="chamado-row-actions">
                            ${c.status !== 'Resolvido' && c.status !== 'Cancelado' ? `
                                ${c.status === 'Aberto' ? `<button class="btn-gerenciar atender" onclick="acaoChamado(${c.id}, 'atender')">Atender</button>` : ''}
                                <button class="btn-gerenciar resolver" onclick="acaoChamado(${c.id}, 'resolver')">Resolver</button>
                                <button class="btn-gerenciar cancelar" onclick="acaoChamado(${c.id}, 'cancelar')">Cancelar</button>
                            ` : ''}
                            <button class="btn-gerenciar editar" onclick="acaoChamado(${c.id}, 'editar')">Editar</button>
                            <button class="btn-gerenciar visualizar" onclick="window.location.href='acompanhar-chamado.html'">Ver</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            const contador = document.getElementById('resultadoContadorGerenciar');
            if (contador) {
                contador.textContent = `Mostrando ${filtrados.length} chamado${filtrados.length > 1 ? 's' : ''}`;
            }
        }

        function filtrarGerenciar() {
            exibirGerenciar();
        }

        document.addEventListener('DOMContentLoaded', function() {
            exibirGerenciar();
        });
    </script>
</body>
</html>
