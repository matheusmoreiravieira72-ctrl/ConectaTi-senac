<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6C63FF">
    <title>Acompanhar Chamado - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .menu-icon { width:20px; height:20px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
        .menu-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .sidebar-nav a.active .menu-icon svg { stroke:white; }
        .sidebar-nav a:hover .menu-icon svg { stroke:var(--text-primary); }
        .menu-badge { background:var(--danger); color:white; font-size:0.55rem; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:auto; min-width:18px; text-align:center; }
        .menu-divider { height:1px; background:var(--border-color); margin:8px 12px; }
        
        .status-timeline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            position: relative;
        }
        .status-timeline::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 3px;
            background: var(--border-color);
            transform: translateY(-50%);
        }
        .status-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 1;
            cursor: pointer;
        }
        .status-step .circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            transition: var(--transition);
        }
        .status-step.active .circle {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        .status-step.done .circle {
            border-color: var(--success);
            background: var(--success);
            color: white;
        }
        .status-step .label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-align: center;
        }
        .status-step.active .label { color: var(--primary); font-weight: 600; }
        .status-step.done .label { color: var(--success); }
        
        .chamado-detalhe {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-top: 16px;
        }
        .chamado-detalhe .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color-light);
        }
        .chamado-detalhe .row:last-child { border-bottom: none; }
        .chamado-detalhe .label { color: var(--text-muted); font-size: 0.75rem; }
        .chamado-detalhe .value { font-weight: 600; font-size: 0.85rem; }
        
        .btn-acao {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: var(--border-radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-acao:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(108,99,255,0.3); }
        .btn-acao.success { background: var(--success); }
        .btn-acao.danger { background: var(--danger); }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="url(#grad)"/><text x="20" y="27" font-family="Arial" font-size="16" font-weight="800" fill="white" text-anchor="middle">CT</text><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6C63FF"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient></defs></svg></div>
            <h1>ConectaTI</h1>
        </div>
        <nav class="sidebar-nav">
            <p class="nav-label">Menu Principal</p>
            <a href="dashboard.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Dashboard</a>
            <a href="novo-chamado.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span> Novo Chamado</a>
            <a href="chat.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> Chat <span class="menu-badge">3</span></a>
            <a href="acompanhar-chamado.html" class="active"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> Acompanhar Chamado</a>
            <a href="duvidas-frequentes.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> Dúvidas Frequentes</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="userName">Usuário</div>
                    <div class="user-perfil" id="userPerfil">Perfil</div>
                    <div class="user-perfil" id="userUnidade">Unidade</div>
                </div>
            </div>
            <div class="sidebar-actions">
                <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" style="width:100%; margin-bottom:8px;">Tema</button>
                <a href="index.html" onclick="localStorage.clear();" class="btn btn-danger btn-sm" style="width:100%;">Sair</a>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">
        <header class="content-header">
            <div class="page-title">
                <h1>📋 Acompanhar Chamado</h1>
                <p>Veja o status e detalhes do seu chamado</p>
            </div>
            <div class="header-actions">
                <span class="date-display" id="dataAtual"></span>
                <a href="index.html" onclick="localStorage.clear();" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </header>

        <div style="padding: 0 24px 16px;">
            <div class="filtros-container">
                <div class="busca">
                    <span class="icone">🔍</span>
                    <input type="text" id="buscaAcompanhar" placeholder="Buscar chamado por ID ou solicitante..." oninput="filtrarAcompanhar()">
                </div>
                <select id="filtroStatusAcompanhar" onchange="filtrarAcompanhar()">
                    <option value="todos">Todos Status</option>
                    <option value="Aberto">Aberto</option>
                    <option value="Em atendimento">Em Atendimento</option>
                    <option value="Resolvido">Resolvido</option>
                    <option value="Atrasado">Atrasado</option>
                </select>
            </div>

            <div id="listaAcompanhar"></div>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script>
        const chamadosAcompanhar = [
            {
                id: 1,
                solicitante: 'Rayssa Paiva',
                perfil: 'Instrutor',
                categoria: 'Reserva de notebooks',
                sala: 'Lab 02',
                prioridade: 'Alta',
                status: 'Em atendimento',
                data: '03/07/2026',
                descricao: 'Preciso reservar 15 notebooks para a turma de TADS',
                historico: [
                    { data: '03/07/2026 08:30', acao: 'Chamado aberto por Rayssa Paiva' },
                    { data: '03/07/2026 09:00', acao: 'Chamado em atendimento - Suporte TI' }
                ]
            },
            {
                id: 2,
                solicitante: 'Carla Mendes',
                perfil: 'Coordenacao',
                categoria: 'Projetor',
                sala: 'Sala 12',
                prioridade: 'Média',
                status: 'Aberto',
                data: '03/07/2026',
                descricao: 'Projetor da sala 12 está com a imagem desfocada',
                historico: [
                    { data: '03/07/2026 10:15', acao: 'Chamado aberto por Carla Mendes' }
                ]
            },
            {
                id: 3,
                solicitante: 'Ana Souza',
                perfil: 'Instrutor',
                categoria: 'Computador com defeito',
                sala: 'Lab 03',
                prioridade: 'Alta',
                status: 'Resolvido',
                data: '03/07/2026',
                descricao: '3 computadores do Lab 03 não estão ligando',
                historico: [
                    { data: '03/07/2026 08:00', acao: 'Chamado aberto por Ana Souza' },
                    { data: '03/07/2026 09:30', acao: 'Em atendimento - Técnico identificou fonte queimada' },
                    { data: '03/07/2026 11:00', acao: 'Chamado resolvido - Computadores substituídos' }
                ]
            }
        ];

        function getBadgeAcompanhar(status) {
            const classes = {
                'Aberto': 'badge-aberto',
                'Em atendimento': 'badge-atendimento',
                'Resolvido': 'badge-resolvido',
                'Atrasado': 'badge-atrasado'
            };
            return `<span class="badge ${classes[status] || 'badge-aberto'}">${status}</span>`;
        }

        function getStatusTimeline(status) {
            const steps = ['Aberto', 'Em atendimento', 'Resolvido'];
            const currentIndex = steps.indexOf(status);
            
            return steps.map((step, index) => {
                let classe = '';
                if (index < currentIndex) classe = 'done';
                else if (index === currentIndex) classe = 'active';
                
                return `
                    <div class="status-step ${classe}">
                        <div class="circle">${index + 1}</div>
                        <span class="label">${step}</span>
                    </div>
                `;
            }).join('');
        }

        function exibirAcompanhar() {
            const container = document.getElementById('listaAcompanhar');
            const busca = document.getElementById('buscaAcompanhar')?.value.toLowerCase() || '';
            const status = document.getElementById('filtroStatusAcompanhar')?.value || 'todos';

            let filtrados = chamadosAcompanhar.filter(c => {
                const matchBusca = c.id.toString().includes(busca) || c.solicitante.toLowerCase().includes(busca);
                const matchStatus = status === 'todos' || c.status === status;
                return matchBusca && matchStatus;
            });

            container.innerHTML = filtrados.map(c => `
                <div class="chamado-detalhe">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <div>
                            <strong style="font-size:1.1rem;">#${c.id.toString().padStart(3, '0')} - ${c.solicitante}</strong>
                            <span style="margin-left:12px;">${getBadgeAcompanhar(c.status)}</span>
                        </div>
                        <span style="font-size:0.75rem; color:var(--text-muted);">${c.data}</span>
                    </div>
                    
                    <div class="row">
                        <span class="label">Categoria</span>
                        <span class="value">${c.categoria}</span>
                    </div>
                    <div class="row">
                        <span class="label">Sala</span>
                        <span class="value">${c.sala}</span>
                    </div>
                    <div class="row">
                        <span class="label">Prioridade</span>
                        <span class="value">${c.prioridade}</span>
                    </div>
                    <div class="row">
                        <span class="label">Descrição</span>
                        <span class="value">${c.descricao}</span>
                    </div>
                    
                    <div style="margin-top:16px;">
                        <div class="status-timeline">
                            ${getStatusTimeline(c.status)}
                        </div>
                    </div>
                    
                    <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border-color-light);">
                        <span style="font-size:0.7rem; color:var(--text-muted);">📋 Histórico</span>
                        ${c.historico.map(h => `
                            <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:0.75rem; color:var(--text-secondary);">
                                <span>${h.acao}</span>
                                <span style="color:var(--text-muted);">${h.data}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
                        ${c.status !== 'Resolvido' ? `
                            <button class="btn-acao" onclick="mostrarNotificacao('Entrando em contato com o suporte...', 'info')">💬 Falar com Suporte</button>
                            <button class="btn-acao" onclick="mostrarNotificacao('Chamado atualizado com sucesso!', 'success')">📝 Atualizar</button>
                        ` : `
                            <button class="btn-acao success" onclick="mostrarNotificacao('Chamado resolvido! Obrigado pelo feedback.', 'success')">✅ Chamado Resolvido</button>
                        `}
                        <button class="btn-acao" onclick="window.location.href='chat.html'" style="background:var(--info);">💬 Chat</button>
                    </div>
                </div>
            `).join('');

            if (filtrados.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:40px; color:var(--text-muted);">
                        <span style="font-size:2rem; display:block; margin-bottom:8px;">📋</span>
                        Nenhum chamado encontrado
                    </div>
                `;
            }
        }

        function filtrarAcompanhar() {
            exibirAcompanhar();
        }

        document.addEventListener('DOMContentLoaded', function() {
            exibirAcompanhar();
        });
    </script>
</body>
</html>
