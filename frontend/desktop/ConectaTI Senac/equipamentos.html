<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#6C63FF">
    <title>Equipamentos - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="10" fill="url(#grad1)"/>
                    <text x="20" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">CT</text>
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>ConectaTI</h1>
        </div>
        <nav class="sidebar-nav">
            <p class="nav-label">Menu</p>
            <a href="dashboard.html">Dashboard</a>
            <a href="chamados.html">Chamados</a>
            <a href="novo-chamado.html">Novo Chamado</a>
            <a href="equipamentos.html" class="active">Equipamentos</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="userName">Usuário</div>
                    <div class="user-perfil" id="userPerfil">Perfil</div>
                </div>
            </div>
            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">
                <a href="index.html" onclick="localStorage.clear(); mostrarNotificacao('Saindo do sistema...', 'info');" class="btn btn-danger btn-sm" style="width:100%;">Sair</a>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">
        <header class="content-header">
            <div class="page-title">
                <h1>Equipamentos</h1>
                <p>Gerencie os equipamentos do sistema</p>
            </div>
            <div class="header-actions">
                <span class="date-display" id="dataAtual"></span>
                <button class="menu-toggle" onclick="toggleSidebar()">Menu</button>
                <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" title="Alternar tema">Tema</button>
                <a href="index.html" onclick="localStorage.clear(); mostrarNotificacao('Saindo do sistema...', 'info');" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </header>

        <div class="tabela-wrapper">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Patrimônio</th>
                        <th>Status</th>
                        <th>Localização</th>
                    </tr>
                </thead>
                <tbody id="listaEquipamentos"></tbody>
            </table>
        </div>
    </main>

    <nav class="tab-bar">
        <ul>
            <li><a href="dashboard.html">Inicio</a></li>
            <li><a href="chamados.html">Chamados</a></li>
            <li><a href="novo-chamado.html">Novo</a></li>
            <li><a href="equipamentos.html" class="active">Equip.</a></li>
            <li><a href="index.html" onclick="localStorage.clear(); mostrarNotificacao('Saindo do sistema...', 'info');">Sair</a></li>
        </ul>
    </nav>

    <script src="js/script.js"></script>
</body>
</html>
