<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#6C63FF">
    <title>Login - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-logo">CT</div>
        <h1>ConectaTI Senac</h1>
        <p class="subtitle">Faça login para continuar</p>
        
        <div style="text-align: center; margin-bottom: 20px;">
            <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" style="min-width: 120px;">
                Tema
            </button>
        </div>
        
        <form id="loginForm" onsubmit="validarLogin(event)">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>
            
            <div class="form-group">
                <label for="perfil">Perfil</label>
                <select id="perfil">
                    <option value="">Selecione seu perfil</option>
                    <option value="Instrutor">Instrutor</option>
                    <option value="Suporte TI">Suporte TI</option>
                    <option value="Coordenacao">Coordenação</option>
                    <option value="Administrador">Administrador</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="unidade">Unidade Senac</label>
                <select id="unidade">
                    <option value="">Selecione a unidade</option>
                    <option value="Taguatinga">Taguatinga</option>
                    <option value="Brasília">Brasília</option>
                    <option value="Ceilândia">Ceilândia</option>
                    <option value="Gama">Gama</option>
                    <option value="Guará">Guará</option>
                    <option value="Planaltina">Planaltina</option>
                    <option value="Recanto das Emas">Recanto das Emas</option>
                    <option value="Samambaia">Samambaia</option>
                    <option value="Santa Maria">Santa Maria</option>
                    <option value="São Sebastião">São Sebastião</option>
                    <option value="Sobradinho">Sobradinho</option>
                    <option value="Vicente Pires">Vicente Pires</option>
                    <option value="Águas Claras">Águas Claras</option>
                    <option value="Asa Norte">Asa Norte</option>
                    <option value="Asa Sul">Asa Sul</option>
                    <option value="Lago Norte">Lago Norte</option>
                    <option value="Lago Sul">Lago Sul</option>
                    <option value="Núcleo Bandeirante">Núcleo Bandeirante</option>
                    <option value="Park Way">Park Way</option>
                    <option value="Riacho Fundo">Riacho Fundo</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
    </div>
    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
