<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6C63FF">
    <title>Chat - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .menu-icon { width:20px; height:20px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
        .menu-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .sidebar-nav a.active .menu-icon svg { stroke:white; }
        .sidebar-nav a:hover .menu-icon svg { stroke:var(--text-primary); }
        .menu-badge { background:var(--danger); color:white; font-size:0.55rem; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:auto; min-width:18px; text-align:center; }
        .menu-divider { height:1px; background:var(--border-color); margin:8px 12px; }
        
        .chat-layout {
            display: flex;
            gap: 16px;
            padding: 0 24px 16px;
            height: calc(100vh - 180px);
        }
        
        .chat-sidebar {
            width: 260px;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .chat-sidebar .titulo {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            padding: 8px 4px 4px;
            letter-spacing: 0.3px;
        }
        .chat-sidebar .usuario-online {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 2px;
        }
        .chat-sidebar .usuario-online:hover { background: var(--bg-card-hover); }
        .chat-sidebar .usuario-online.active { background: var(--primary); color: white; }
        .chat-sidebar .usuario-online .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: white;
            flex-shrink: 0;
            position: relative;
        }
        .chat-sidebar .usuario-online .avatar .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: absolute;
            bottom: -2px;
            right: -2px;
            border: 2px solid var(--bg-card);
        }
        .chat-sidebar .usuario-online .avatar .status-dot.online { background: var(--success); }
        .chat-sidebar .usuario-online .avatar .status-dot.offline { background: var(--text-muted); }
        .chat-sidebar .usuario-online .avatar .status-dot.away { background: var(--warning); }
        .chat-sidebar .usuario-online .nome {
            font-size: 0.8rem;
            font-weight: 500;
        }
        .chat-sidebar .usuario-online .perfil-chat {
            font-size: 0.6rem;
            color: var(--text-muted);
            display: block;
        }
        .chat-sidebar .usuario-online.active .perfil-chat { color: rgba(255,255,255,0.7); }
        .chat-sidebar .mensagem-nao-lida {
            margin-left: auto;
            background: var(--danger);
            color: white;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .chat-main .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-main .chat-header .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-main .chat-header .info .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        .chat-main .chat-header .info .nome { font-weight: 600; font-size: 0.9rem; }
        .chat-main .chat-header .info .status { font-size: 0.65rem; color: var(--text-muted); }
        .chat-main .chat-header .info .status.online { color: var(--success); }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .chat-message {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            animation: fadeInUp 0.3s ease;
        }
        .chat-message.sent { flex-direction: row-reverse; }
        .chat-message .avatar-msg {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.65rem;
            color: white;
            flex-shrink: 0;
        }
        .chat-message .bubble {
            max-width: 70%;
            padding: 8px 14px;
            border-radius: 12px;
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .chat-message.sent .bubble {
            background: var(--primary);
            color: white;
        }
        .chat-message .bubble .time {
            font-size: 0.5rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
        }
        .chat-message.sent .bubble .time { color: rgba(255,255,255,0.7); }
        .chat-message .bubble .nome-msg {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--primary);
            display: block;
            margin-bottom: 2px;
        }
        .chat-message.sent .bubble .nome-msg { color: rgba(255,255,255,0.9); }
        
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 8px 14px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.85rem;
            min-height: 40px;
        }
        .chat-input-area input:focus { border-color: var(--primary); outline: none; }
        .chat-input-area .btn-send {
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--border-radius-sm);
            padding: 8px 20px;
            font-weight: 600;
            cursor: pointer;
            min-height: 40px;
            transition: var(--transition);
        }
        .chat-input-area .btn-send:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(108,99,255,0.3); }
        
        .chat-vazio {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }
        .chat-vazio .icon { font-size: 3rem; margin-bottom: 12px; }
        .chat-vazio h3 { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 4px; }
        .chat-vazio p { font-size: 0.85rem; }
        
        @media (max-width: 768px) {
            .chat-layout { flex-direction: column; height: auto; }
            .chat-sidebar { width: 100%; max-height: 200px; }
            .chat-main { min-height: 400px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="url(#grad)"/><text x="20" y="27" font-family="Arial" font-size="16" font-weight="800" fill="white" text-anchor="middle">CT</text><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6C63FF"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient></defs></svg></div>
            <h1>ConectaTI</h1>
        </div>
        <nav class="sidebar-nav">
            <p class="nav-label">Menu Principal</p>
            <a href="dashboard.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Dashboard</a>
            <a href="novo-chamado.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span> Novo Chamado</a>
            <a href="chat.html" class="active"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> Chat <span class="menu-badge">3</span></a>
            <a href="acompanhar-chamado.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> Acompanhar Chamado</a>
            <a href="duvidas-frequentes.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> Dúvidas Frequentes</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="userName">Usuário</div>
                    <div class="user-perfil" id="userPerfil">Perfil</div>
                    <div class="user-perfil" id="userUnidade">Unidade</div>
                </div>
            </div>
            <div class="sidebar-actions">
                <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" style="width:100%; margin-bottom:8px;">Tema</button>
                <a href="index.html" onclick="localStorage.clear();" class="btn btn-danger btn-sm" style="width:100%;">Sair</a>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">
        <header class="content-header">
            <div class="page-title">
                <h1>💬 Chat</h1>
                <p>Converse com a equipe em tempo real</p>
            </div>
            <div class="header-actions">
                <span class="date-display" id="dataAtual"></span>
                <a href="index.html" onclick="localStorage.clear();" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </header>

        <div class="chat-layout">
            <!-- Sidebar com usuários -->
            <div class="chat-sidebar" id="chatSidebar">
                <div class="titulo">📌 Usuários Online</div>
                <div id="listaUsuariosOnline"></div>
                <div class="titulo" style="margin-top:12px;">📋 Conversas Recentes</div>
                <div id="listaConversas"></div>
            </div>

            <!-- Área principal do chat -->
            <div class="chat-main">
                <div class="chat-header" id="chatHeader">
                    <div class="info">
                        <div class="avatar" id="chatAvatar" style="background:#6C63FF;">S</div>
                        <div>
                            <div class="nome" id="chatNome">Suporte TI</div>
                            <div class="status online" id="chatStatus">● Online</div>
                        </div>
                    </div>
                    <span style="font-size:0.7rem; color:var(--text-muted);" id="chatUnidade">Taguatinga</span>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Mensagens serão inseridas aqui -->
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviarMensagemChat()">
                    <button class="btn-send" onclick="enviarMensagemChat()">Enviar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script>
        // ========================
        // USUÁRIOS ONLINE
        // ========================
        const usuariosOnline = [
            { id: 1, nome: 'João Suporte', perfil: 'Suporte TI', unidade: 'Taguatinga', status: 'online', cor: '#6C63FF' },
            { id: 2, nome: 'Rayssa Paiva', perfil: 'Instrutor', unidade: 'Taguatinga', status: 'online', cor: '#FF6B6B' },
            { id: 3, nome: 'Carla Mendes', perfil: 'Coordenação', unidade: 'Taguatinga', status: 'online', cor: '#4D96FF' },
            { id: 4, nome: 'Ana Souza', perfil: 'Instrutor', unidade: 'Gama', status: 'away', cor: '#FFB347' },
            { id: 5, nome: 'Pedro Santos', perfil: 'Coordenação', unidade: 'Ceilândia', status: 'offline', cor: '#8A8AA8' }
        ];

        // ========================
        // CONVERSAS
        // ========================
        const conversas = {
            'João Suporte': [
                { usuario: 'João Suporte', mensagem: 'Olá! Como posso ajudar você?', hora: '10:30' },
                { usuario: 'Você', mensagem: 'Estou com problema no projetor da sala 12', hora: '10:32' },
                { usuario: 'João Suporte', mensagem: 'Vou verificar agora mesmo!', hora: '10:33' }
            ],
            'Rayssa Paiva': [
                { usuario: 'Rayssa Paiva', mensagem: 'Oi! Preciso reservar notebooks para amanhã', hora: '09:15' },
                { usuario: 'Você', mensagem: 'Quantos notebooks você precisa?', hora: '09:17' },
                { usuario: 'Rayssa Paiva', mensagem: '15 notebooks para a turma de TADS', hora: '09:18' }
            ],
            'Carla Mendes': [
                { usuario: 'Carla Mendes', mensagem: 'Bom dia! O relatório está pronto?', hora: '08:00' },
                { usuario: 'Você', mensagem: 'Bom dia! Estou finalizando, envio em 1 hora', hora: '08:05' }
            ]
        };

        let conversaAtual = 'João Suporte';

        // ========================
        // FUNÇÕES
        // ========================
        function getStatusText(status) {
            const map = { 'online': 'Online', 'offline': 'Offline', 'away': 'Ausente' };
            return map[status] || 'Online';
        }

        function getStatusDot(status) {
            return status;
        }

        function exibirUsuariosOnline() {
            const container = document.getElementById('listaUsuariosOnline');
            const perfil = localStorage.getItem('perfilUsuario') || 'Usuário';
            
            container.innerHTML = usuariosOnline.map(u => `
                <div class="usuario-online ${conversaAtual === u.nome ? 'active' : ''}" onclick="abrirConversa('${u.nome}')">
                    <div class="avatar" style="background:${u.cor}">
                        ${u.nome.charAt(0)}
                        <span class="status-dot ${getStatusDot(u.status)}"></span>
                    </div>
                    <div>
                        <span class="nome">${u.nome}</span>
                        <span class="perfil-chat">${u.perfil} - ${u.unidade}</span>
                    </div>
                    ${u.status === 'online' ? `<span class="mensagem-nao-lida">${Math.floor(Math.random() * 3) + 1}</span>` : ''}
                </div>
            `).join('');
        }

        function exibirConversas() {
            const container = document.getElementById('listaConversas');
            const keys = Object.keys(conversas);
            
            container.innerHTML = keys.map(key => `
                <div class="usuario-online" onclick="abrirConversa('${key}')">
                    <div class="avatar" style="background:${usuariosOnline.find(u => u.nome === key)?.cor || '#6C63FF'}">
                        ${key.charAt(0)}
                    </div>
                    <div>
                        <span class="nome">${key}</span>
                        <span class="perfil-chat">${conversas[key].length} mensagens</span>
                    </div>
                </div>
            `).join('');
        }

        function abrirConversa(nome) {
            conversaAtual = nome;
            exibirUsuariosOnline();
            exibirMensagensChat(nome);
            
            const usuario = usuariosOnline.find(u => u.nome === nome);
            if (usuario) {
                document.getElementById('chatAvatar').textContent = usuario.nome.charAt(0);
                document.getElementById('chatAvatar').style.background = usuario.cor;
                document.getElementById('chatNome').textContent = usuario.nome;
                document.getElementById('chatStatus').textContent = `● ${getStatusText(usuario.status)}`;
                document.getElementById('chatStatus').className = `status ${usuario.status}`;
                document.getElementById('chatUnidade').textContent = usuario.unidade;
            }
        }

        function exibirMensagensChat(nome) {
            const container = document.getElementById('chatMessages');
            const mensagens = conversas[nome] || [];
            const perfil = localStorage.getItem('perfilUsuario') || 'Usuário';

            if (mensagens.length === 0) {
                container.innerHTML = `
                    <div class="chat-vazio">
                        <div class="icon">💬</div>
                        <h3>Nenhuma mensagem</h3>
                        <p>Envie uma mensagem para iniciar a conversa</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = mensagens.map(m => {
                const isSent = m.usuario === 'Você' || m.usuario === perfil;
                const usuario = usuariosOnline.find(u => u.nome === m.usuario);
                const cor = usuario?.cor || '#6C63FF';
                const iniciais = m.usuario.charAt(0);
                const nomeExibido = m.usuario === 'Você' ? perfil : m.usuario;
                
                return `
                    <div class="chat-message ${isSent ? 'sent' : ''}">
                        <div class="avatar-msg" style="background:${cor}">${iniciais}</div>
                        <div class="bubble">
                            <span class="nome-msg">${nomeExibido}</span>
                            ${m.mensagem}
                            <span class="time">${m.hora}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        function enviarMensagemChat() {
            const input = document.getElementById('chatInput');
            const mensagem = input.value.trim();
            if (!mensagem) return;

            const perfil = localStorage.getItem('perfilUsuario') || 'Usuário';
            const now = new Date();
            const hora = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            if (!conversas[conversaAtual]) {
                conversas[conversaAtual] = [];
            }

            conversas[conversaAtual].push({
                usuario: 'Você',
                mensagem: mensagem,
                hora: hora
            });

            input.value = '';
            exibirMensagensChat(conversaAtual);
            exibirConversas();

            // Simula resposta automática
            setTimeout(() => {
                const respostas = [
                    'Entendi! Vou resolver isso agora mesmo.',
                    'Ok, estou verificando para você.',
                    'Já estou analisando o problema.',
                    'Pode deixar que vou te ajudar.',
                    'Ótimo! Já estou trabalhando nisso.',
                    'Vou encaminhar para o setor responsável.',
                    'Assim que possível te dou um retorno.'
                ];
                const resposta = respostas[Math.floor(Math.random() * respostas.length)];
                
                if (!conversas[conversaAtual]) {
                    conversas[conversaAtual] = [];
                }
                
                const agora = new Date();
                const horaResp = agora.getHours().toString().padStart(2, '0') + ':' + agora.getMinutes().toString().padStart(2, '0');
                
                conversas[conversaAtual].push({
                    usuario: conversaAtual,
                    mensagem: resposta,
                    hora: horaResp
                });
                
                exibirMensagensChat(conversaAtual);
                exibirConversas();
            }, 1500);
        }

        // ========================
        // INICIALIZAÇÃO
        // ========================
        document.addEventListener('DOMContentLoaded', function() {
            exibirUsuariosOnline();
            exibirConversas();
            
            // Abre a primeira conversa
            const primeiraConversa = Object.keys(conversas)[0];
            if (primeiraConversa) {
                abrirConversa(primeiraConversa);
            }
        });
    </script>
</body>
</html>
