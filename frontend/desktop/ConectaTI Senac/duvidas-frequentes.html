<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6C63FF">
    <title>Dúvidas Frequentes - ConectaTI Senac</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .menu-icon { width:20px; height:20px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
        .menu-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .sidebar-nav a.active .menu-icon svg { stroke:white; }
        .sidebar-nav a:hover .menu-icon svg { stroke:var(--text-primary); }
        .menu-badge { background:var(--danger); color:white; font-size:0.55rem; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:auto; min-width:18px; text-align:center; }
        .menu-divider { height:1px; background:var(--border-color); margin:8px 12px; }
        
        .duvida-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition);
        }
        .duvida-card:hover { border-color: rgba(108,99,255,0.2); }
        .duvida-card .pergunta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .duvida-card .pergunta .icon {
            font-size: 1.2rem;
            margin-right: 12px;
        }
        .duvida-card .pergunta .toggle {
            transition: var(--transition);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .duvida-card .pergunta .toggle.open { transform: rotate(180deg); }
        .duvida-card .resposta {
            display: none;
            padding-top: 12px;
            margin-top: 12px;
            border-top: 1px solid var(--border-color-light);
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .duvida-card .resposta.open { display: block; }
        .duvida-card .categoria {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 600;
            background: rgba(108,99,255,0.15);
            color: var(--primary);
            margin-top: 8px;
        }
        .duvida-card .categoria.suporte { background: rgba(77,150,255,0.15); color: #4D96FF; }
        .duvida-card .categoria.equipamentos { background: rgba(107,203,119,0.15); color: #6BCB77; }
        .duvida-card .categoria.chamados { background: rgba(255,179,71,0.15); color: #FFB347; }
        .duvida-card .categoria.reservas { background: rgba(108,99,255,0.15); color: #6C63FF; }
        
        .duvida-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            padding: 0 24px 16px;
        }
        .duvida-stat {
            background: var(--bg-card);
            padding: 14px 16px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .duvida-stat .numero { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .duvida-stat .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="url(#grad)"/><text x="20" y="27" font-family="Arial" font-size="16" font-weight="800" fill="white" text-anchor="middle">CT</text><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6C63FF"/><stop offset="100%" stop-color="#FF6B6B"/></linearGradient></defs></svg></div>
            <h1>ConectaTI</h1>
        </div>
        <nav class="sidebar-nav">
            <p class="nav-label">Menu Principal</p>
            <a href="dashboard.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Dashboard</a>
            <a href="novo-chamado.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span> Novo Chamado</a>
            <a href="chat.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> Chat <span class="menu-badge">3</span></a>
            <a href="acompanhar-chamado.html"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> Acompanhar Chamado</a>
            <a href="duvidas-frequentes.html" class="active"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> Dúvidas Frequentes</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="userName">Usuário</div>
                    <div class="user-perfil" id="userPerfil">Perfil</div>
                    <div class="user-perfil" id="userUnidade">Unidade</div>
                </div>
            </div>
            <div class="sidebar-actions">
                <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" style="width:100%; margin-bottom:8px;">Tema</button>
                <a href="index.html" onclick="localStorage.clear();" class="btn btn-danger btn-sm" style="width:100%;">Sair</a>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">
        <header class="content-header">
            <div class="page-title">
                <h1>❓ Dúvidas Frequentes</h1>
                <p>Encontre respostas para as perguntas mais comuns</p>
            </div>
            <div class="header-actions">
                <span class="date-display" id="dataAtual"></span>
                <button class="btn btn-primary btn-sm" onclick="mostrarNotificacao('Sugestão enviada!', 'success')">💡 Sugerir Pergunta</button>
                <a href="index.html" onclick="localStorage.clear();" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </header>

        <div class="duvida-stats">
            <div class="duvida-stat">
                <div class="numero">12</div>
                <div class="label">Perguntas</div>
            </div>
            <div class="duvida-stat">
                <div class="numero">5</div>
                <div class="label">Categorias</div>
            </div>
            <div class="duvida-stat">
                <div class="numero">98%</div>
                <div class="label">Satisfação</div>
            </div>
            <div class="duvida-stat">
                <div class="numero">24h</div>
                <div class="label">Tempo Médio</div>
            </div>
        </div>

        <div class="filtros-container">
            <div class="busca">
                <span class="icone">🔍</span>
                <input type="text" id="buscaDuvidas" placeholder="Buscar dúvidas..." oninput="filtrarDuvidas()">
            </div>
            <select id="filtroCategoriaDuvida" onchange="filtrarDuvidas()">
                <option value="todos">Todas Categorias</option>
                <option value="Chamados">Chamados</option>
                <option value="Equipamentos">Equipamentos</option>
                <option value="Reservas">Reservas</option>
                <option value="Suporte">Suporte</option>
                <option value="Sistema">Sistema</option>
            </select>
        </div>

        <div style="padding: 0 24px 16px;" id="listaDuvidas"></div>
    </main>

    <script src="js/script.js"></script>
    <script>
        const duvidas = [
            { id: 1, pergunta: 'Como reservar notebooks para minha turma?', 
              resposta: 'Acesse o menu "Novo Chamado", selecione a categoria "Reserva de notebooks", informe a quantidade de notebooks, a data e o horário desejados. O suporte confirmará a reserva em até 2 horas úteis.',
              categoria: 'Reservas', icone: '📚' },
            { id: 2, pergunta: 'O que fazer se o projetor não funcionar?',
              resposta: 'Verifique se o projetor está ligado e todos os cabos estão conectados corretamente. Se o problema persistir, abra um chamado na categoria "Projetor" informando a sala e o problema observado.',
              categoria: 'Equipamentos', icone: '📽️' },
            { id: 3, pergunta: 'Como acompanhar o status do meu chamado?',
              resposta: 'Acesse o menu "Acompanhar Chamado" onde você verá todos os seus chamados com o status atual. Você também pode ver o histórico completo de cada chamado.',
              categoria: 'Chamados', icone: '📋' },
            { id: 4, pergunta: 'Qual o prazo para atendimento de um chamado?',
              resposta: 'Chamados com prioridade "Urgente" são atendidos em até 2 horas. Chamados com prioridade "Alta" em até 4 horas. Os demais chamados têm prazo de até 24 horas úteis.',
              categoria: 'Chamados', icone: '⏱️' },
            { id: 5, pergunta: 'Como solicitar um novo equipamento?',
              resposta: 'Para solicitar um novo equipamento, abra um chamado na categoria correspondente (Notebook, Projetor, etc.) e descreva a necessidade. A coordenação analisará a solicitação.',
              categoria: 'Equipamentos', icone: '💻' },
            { id: 6, pergunta: 'Esqueci minha senha, como recuperar?',
              resposta: 'Clique em "Esqueci minha senha" na tela de login. Você receberá um e-mail com instruções para redefinir sua senha. Entre em contato com o suporte se não receber o e-mail.',
              categoria: 'Suporte', icone: '🔑' },
            { id: 7, pergunta: 'Como funciona o chat de suporte?',
              resposta: 'O chat está disponível no menu lateral. Você pode conversar em tempo real com a equipe de suporte para resolver problemas rapidamente. O chat fica disponível durante o horário comercial.',
              categoria: 'Suporte', icone: '💬' },
            { id: 8, pergunta: 'Posso cancelar um chamado já aberto?',
              resposta: 'Sim, acesse "Acompanhar Chamado", localize o chamado e clique em "Cancelar Chamado". Apenas chamados com status "Aberto" podem ser cancelados.',
              categoria: 'Chamados', icone: '❌' }
        ];

        function getCategoriaClass(categoria) {
            const classes = {
                'Chamados': 'chamados',
                'Equipamentos': 'equipamentos',
                'Reservas': 'reservas',
                'Suporte': 'suporte',
                'Sistema': 'suporte'
            };
            return classes[categoria] || 'suporte';
        }

        function exibirDuvidas() {
            const container = document.getElementById('listaDuvidas');
            const busca = document.getElementById('buscaDuvidas')?.value.toLowerCase() || '';
            const categoria = document.getElementById('filtroCategoriaDuvida')?.value || 'todos';

            let filtrados = duvidas.filter(d => {
                const matchBusca = d.pergunta.toLowerCase().includes(busca) || d.resposta.toLowerCase().includes(busca);
                const matchCategoria = categoria === 'todos' || d.categoria === categoria;
                return matchBusca && matchCategoria;
            });

            container.innerHTML = filtrados.map(d => `
                <div class="duvida-card" onclick="toggleDuvida(${d.id})">
                    <div class="pergunta">
                        <span>
                            <span class="icon">${d.icone}</span>
                            ${d.pergunta}
                        </span>
                        <span class="toggle" id="toggle-${d.id}">▼</span>
                    </div>
                    <div class="resposta" id="resposta-${d.id}">
                        ${d.resposta}
                        <div>
                            <span class="categoria ${getCategoriaClass(d.categoria)}">${d.categoria}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            if (filtrados.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:40px; color:var(--text-muted);">
                        <span style="font-size:2rem; display:block; margin-bottom:8px;">🔍</span>
                        Nenhuma dúvida encontrada
                    </div>
                `;
            }
        }

        function toggleDuvida(id) {
            const resposta = document.getElementById(`resposta-${id}`);
            const toggle = document.getElementById(`toggle-${id}`);
            if (resposta && toggle) {
                resposta.classList.toggle('open');
                toggle.classList.toggle('open');
            }
        }

        function filtrarDuvidas() {
            exibirDuvidas();
        }

        document.addEventListener('DOMContentLoaded', function() {
            exibirDuvidas();
        });
    </script>
</body>
</html>
