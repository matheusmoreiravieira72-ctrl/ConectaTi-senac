        .menu-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .sidebar-nav a.active .menu-icon svg { stroke:white; }
        .sidebar-nav a:hover .menu-icon svg { stroke:var(--text-primary); }
        .menu-badge { background:var(--danger); color:white; font-size:0.55rem; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:auto; min-width:18px; text-align:center; }
        .menu-divider { height:1px; background:var(--border-color); margin:8px 12px; }

            max-width: 640px;
            margin: 16px 24px;
            padding: 28px;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }
        .form-criar .form-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }
        .form-criar .form-header .icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
            font-size: 1.2rem;
        }
        .form-criar .form-header h1 { font-size: 1.2rem; font-weight: 700; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>

        </div>

            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>

                    <div class="user-name" id="userName">Usuário</div>

                    <div class="user-perfil" id="userUnidade">Unidade</div>

            </div>
            <div class="sidebar-actions">
                <button onclick="toggleTheme()" class="btn btn-secondary btn-sm" style="width:100%; margin-bottom:8px;">Tema</button>

            </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

    <main class="main-content">
        <header class="content-header">
            <div class="page-title">
                <h1>🏢 Criar Unidade</h1>
                <p>Cadastre uma nova unidade do Senac</p>
            </div>
            <div class="header-actions">
                <span class="date-display" id="dataAtual"></span>
                <a href="index.html" onclick="localStorage.clear();" class="btn btn-danger btn-sm">Sair</a>
            </div>
        </header>

        <div class="form-criar">
            <div class="form-header">
                <div class="icon">🏢</div>
                <h1>Nova Unidade</h1>
            </div>

            <form onsubmit="return criarUnidade()">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nomeUnidade">Nome da Unidade</label>
                        <input type="text" id="nomeUnidade" placeholder="Ex: Taguatinga" required>
                    </div>
                    <div class="form-group">
                        <label for="regiaoUnidade">Região</label>
                        <input type="text" id="regiaoUnidade" placeholder="Ex: Taguatinga" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="enderecoUnidade">Endereço</label>
                        <input type="text" id="enderecoUnidade" placeholder="Ex: QNF 24, Área Especial">
                    </div>
                    <div class="form-group">
                        <label for="telefoneUnidade">Telefone</label>
                        <input type="text" id="telefoneUnidade" placeholder="Ex: (61) 1234-5678">
                    </div>
                </div>

                <div class="form-group">
                    <label for="statusUnidade">Status</label>
                    <select id="statusUnidade">
                        <option value="Ativa">Ativa</option>
                        <option value="Inativa">Inativa</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Criar Unidade</button>
            </form>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script>
        function criarUnidade() {
            const nome = document.getElementById('nomeUnidade').value.trim();
            const regiao = document.getElementById('regiaoUnidade').value.trim();
            const endereco = document.getElementById('enderecoUnidade').value.trim();
            const telefone = document.getElementById('telefoneUnidade').value.trim();
            const status = document.getElementById('statusUnidade').value;

            if (!nome || !regiao) {
                mostrarNotificacao('Preencha o nome e a região da unidade!', 'error');
                return false;
            }

            // Simula criação
            const unidades = JSON.parse(localStorage.getItem('unidadesConectaTI') || '[]');
            unidades.push({
                id: unidades.length + 1,
                nome: nome,
                regiao: regiao,
                endereco: endereco || 'Não informado',
                telefone: telefone || 'Não informado',
                status: status,
                data: new Date().toLocaleDateString('pt-BR')
            });
            localStorage.setItem('unidadesConectaTI', JSON.stringify(unidades));

            mostrarNotificacao(`✅ Unidade ${nome} criada com sucesso!`, 'success');
            
            document.getElementById('nomeUnidade').value = '';
            document.getElementById('regiaoUnidade').value = '';
            document.getElementById('enderecoUnidade').value = '';
            document.getElementById('telefoneUnidade').value = '';
            
            return false;
        }
    </script>
</body>
