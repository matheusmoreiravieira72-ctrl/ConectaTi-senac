services:
  postgres:
    image: postgres:16-alpine
    container_name: conectati-postgres
    environment:
      POSTGRES_DB: conectati
      POSTGRES_USER: conectati
      POSTGRES_PASSWORD: conectati
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conectati -d conectati"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
